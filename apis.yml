name: Emailio
description: >-
  Emailio is a Y Combinator (Winter 2014) and Thiel Fellowship-backed startup building "email
  built for wellness" — a consumer email client for iPhone, iPad, and Mac that centers user
  wellbeing and mental health rather than traditional inbox-productivity metrics. Its pre-launch
  landing page describes inbox management, email batching, mood tracking, one-click unsubscribe,
  and Smart Rule Suggestions, with early access gated behind a waitlist. Founded by Martin
  Stoyanov and Teo Teodosiev with a roughly five-person team, Emailio sits at the intersection of
  the productivity and health & wellness categories. It was surfaced as a Y Combinator portfolio
  company and added to the API Evangelist network as a stub for enrichment; as of this pass it
  exposes a consumer product only — no public API, developer portal, documentation, or SDKs could
  be found.
